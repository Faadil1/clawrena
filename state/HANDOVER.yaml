next_actions_priority:
  - sync local winning-intelligence-p11 to origin/winning-intelligence-p11
  - run npx convex dev --once to redeploy the validated P11.2 discovery code to grandiose-poodle-700
  - rerun scripts/prove-authority-runtime.mjs with the default 300-signature scan window
  - if zero launches are still found, configure a dedicated Helius RPC locally/through Convex env without exposing the key in chat and rerun with PUMP_SIGNATURE_SCAN_LIMIT=500
  - capture the first real Pump launch underwriting result; REFUSED is a valid success state
  - require underwriting:verifyReceipt replayConsistency=MATCH
  - run /reunderwrite and capture lineage bound to the prior server-stored replay key
  - only after those receipts exist mark the real external/shadow underwriting gate complete
  - import Evidence Authority skill into a real ClawPump/Hermes agent and produce agent-to-agent shadow-underwriting proof
  - close registration, X/follow and tokenization eligibility receipts before 2026-09-20T23:59:00Z
  - deploy the final canonical frontend to Cloudflare Pages only after runtime evidence is stable
  - reopen TRACE/UI as a Proof-of-Authority Workstation after the authority proof is real

rerun_commands:
  sync: >-
    git fetch origin && git switch winning-intelligence-p11 && git reset --hard origin/winning-intelligence-p11
  deploy_dev: npx convex dev --once
  source_sha_powershell: $env:DEPLOYED_COMMIT_SHA=(git rev-parse HEAD)
  proof: node .\scripts\prove-authority-runtime.mjs
  proof_max_window_powershell: $env:PUMP_SIGNATURE_SCAN_LIMIT="500"; node .\scripts\prove-authority-runtime.mjs
  inspect: Get-Content .\evidence\runtime\P11-AUTHORITY-RUNTIME.json -Raw

