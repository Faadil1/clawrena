  - do not call declared caller metadata verified identity
  - do not call externallyAttributedUnderwritingRequests unique agents/users
  - do not call REFUSED a product failure
  - do not call QUALIFIED final execution authorization
  - do not mark agent-to-agent proof complete without both ClawPump/Hermes and Alpha Scout receipts
