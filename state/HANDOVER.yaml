what_changed_p11_1:
  - centralized AS-AUTHORITY-V1 thresholds, scoring, critical unknowns and freshness in convex/lib/evidencePolicy.ts
  - Evidence Gate and last-mile authority execute the same versioned policy manifest
  - source ledger preserves Pump provenance, Jupiter Price V3 evidence and Solana owner concentration clocks
  - durable underwriting_decisions ledger persists decisions and replay lineage
  - POST /underwrite and POST /reunderwrite are live in the dev Convex deployment
  - GET /authority-policy, /authority-openapi and /authority-stats are live and were reached in the first runtime capture
  - Evidence Passport replay identifiers can be recomputed under the stored policy version
  - underwriting:verifyReceipt verifies stored replay-key consistency without claiming cryptographic signing
  - optional AUTHORITY_API_KEY/x-alpha-scout-key protection remains available for mutating authority endpoints

what_changed_p11_2:
  - preserved the first real runtime discovery failure as evidence instead of overwriting it
  - diagnosed the blocker as discovery recall, not authority HTTP reachability
  - Pump launch verification now checks top-level and CPI inner instructions
  - official create/create_v2 discriminators remain mandatory; no token-balance heuristic was reintroduced
  - discovery now paginates through a bounded window of recent Pump signatures
  - runtime discovery cap is 500 signatures and runtime proof defaults to 300
  - transaction verification uses bounded parallel batches rather than an unbounded crawl
  - discovery now returns signaturesExamined, pagesSearched and configured-RPC diagnostics
  - runtime proof errors now state exactly how many signatures/pages were examined and whether a dedicated RPC was configured
  - P11.2 code passed security, integrity, logic, typecheck, lint, build and runtime-script syntax validation

