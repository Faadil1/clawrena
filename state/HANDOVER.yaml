what_changed_p11_1:
  - centralized AS-AUTHORITY-V1 thresholds, scoring, critical unknowns and freshness in convex/lib/evidencePolicy.ts
  - Evidence Gate and last-mile authority now execute the same versioned policy manifest
  - preserved Jupiter blockId, Solana observation slots and evidence observation timestamps
  - added source ledger for Pump transaction provenance, Jupiter Price V3 and Solana owner concentration
  - added durable underwriting_decisions table keyed by replay history
  - added server-side underwriting persistence and replay-key lookup
  - added POST /reunderwrite; caller supplies only previous replay key and server reuses original mint/signature
  - lineage diff reports policy/state changes, score delta, unknowns resolved/added and blockers resolved/added
  - added GET /authority-openapi for machine-readable integration
  - added GET /authority-stats with explicit request-count truth boundaries
  - added optional AUTHORITY_API_KEY/x-alpha-scout-key protection for mutating authority endpoints
  - upgraded Evidence Authority skill for shadow mode, source lineage and re-underwriting
  - documented P11.1 competitive white-space and specialized x402 authority service
  - kept x402/ANSEM as unproved until real settlement/billing/run evidence exists

