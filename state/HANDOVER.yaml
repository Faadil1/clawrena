next_actions_priority:
  - in the connected clawpump-remote session, create a custom Evidence Authority skill on agent T using skills/evidence-authority/SKILL.md
  - do not trade, transfer, launch a token, create an automation, or start capital-moving activity during the first proof
  - use a real ClawPump chat or tightly bounded autonomous run in shadow mode
  - have that external interaction request Alpha Scout underwriting against a real Pump launch and preserve returned replay key/state
  - preserve real ClawPump agent id plus chat/run id
  - run scripts/capture-agent-to-agent-proof.mjs for Alpha Scout-side consistency proof
  - cross-reference the ClawPump receipt with the Alpha Scout replay key before marking agent-to-agent proof complete
  - if feasible, fund the external agent billing wallet with ANSEM and repeat one real underwriting request before making ANSEM-funded claims
  - only after agent-to-agent proof reopen TRACE/UI as a Proof-of-Authority Workstation
  - keep the current Cloudflare deployment preview-only until final visual/runtime approval

