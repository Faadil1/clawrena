canonical_thesis: >-
  Other agents can discover, analyze, recommend or trade. Alpha Scout independently verifies
  Pump launch provenance and current evidence, applies a versioned deterministic policy, and
  returns QUALIFIED or REFUSED with a durable Evidence Passport and source ledger. QUALIFIED
  is not execution authorization: last-mile provider and risk checks still control value movement.

